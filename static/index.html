<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelved</title>
<meta name="description" content="Search a book you loved and find similar books to read next.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23181329'/%3E%3Cpath d='M32 10c8 10 14 17 14 26a14 14 0 0 1-28 0c0-9 6-16 14-26z' fill='%23e6bd6e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:wght@400..650&display=swap" rel="stylesheet">
<script>
  // Apply a saved theme before first paint so the page never flashes the wrong one.
  try { var t = localStorage.getItem('Shelved.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #110e1d;
    --bg-soft: #181329;
    --surface: #1f1936;
    --surface-hi: #2a2349;
    --line: rgba(222, 210, 255, .13);
    --line-strong: rgba(222, 210, 255, .28);
    --text: #f3eefb;
    --muted: #aca3c8;
    --accent: #e6bd6e;
    --accent-ink: #261b05;
    --accent-text: #e9c47c;
    --moon: #c9bcff;
    --moon-bg: rgba(201, 188, 255, .14);
    --foil: linear-gradient(115deg, #f4d994 0%, #d9a94c 45%, #f1cf86 70%, #c8963b 100%);
    --shadow: 0 22px 44px -20px rgba(0, 0, 0, .75);
    --amb-opacity: .5;
    --serif: "Fraunces", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f3fc;
    --bg-soft: #f0eaf9;
    --surface: #ffffff;
    --surface-hi: #f1ebfa;
    --line: rgba(43, 30, 80, .13);
    --line-strong: rgba(43, 30, 80, .3);
    --text: #231a3a;
    --muted: #625a7c;
    --accent: #2b1e50;
    --accent-ink: #ffffff;
    --accent-text: #7a4f00;
    --moon: #46368f;
    --moon-bg: rgba(70, 54, 143, .1);
    --foil: linear-gradient(115deg, #8a5a00 0%, #c18a1c 50%, #7a4a00 100%);
    --shadow: 0 20px 40px -22px rgba(43, 30, 80, .45);
    --amb-opacity: .32;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f7f3fc;
      --bg-soft: #f0eaf9;
      --surface: #ffffff;
      --surface-hi: #f1ebfa;
      --line: rgba(43, 30, 80, .13);
      --line-strong: rgba(43, 30, 80, .3);
      --text: #231a3a;
      --muted: #625a7c;
      --accent: #2b1e50;
      --accent-ink: #ffffff;
      --accent-text: #7a4f00;
      --moon: #46368f;
      --moon-bg: rgba(70, 54, 143, .1);
      --foil: linear-gradient(115deg, #8a5a00 0%, #c18a1c 50%, #7a4a00 100%);
      --shadow: 0 20px 40px -22px rgba(43, 30, 80, .45);
      --amb-opacity: .32;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  html:has(dialog[open]) { overflow: hidden; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 16px/1.5 var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }
  h1, h2, h3, p { margin: 0; }
  button { font: inherit; color: inherit; }
  a { color: var(--accent-text); }
  :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- ambient glow behind the page ---------- */
  .ambient {
    position: fixed; inset: 0 0 auto 0; height: 75vh; z-index: -1; pointer-events: none; overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 25%, transparent);
            mask-image: linear-gradient(#000 25%, transparent);
  }
  .ambient::before {
    content: ""; position: absolute; inset: -12%;
    background: radial-gradient(50% 55% at 28% 18%, rgba(201, 188, 255, .22), transparent 70%),
                radial-gradient(45% 50% at 78% 8%, rgba(230, 189, 110, .16), transparent 70%);
  }
  .ambient::after {
    content: ""; position: absolute; inset: -15%;
    background: var(--amb-img, none) center / cover no-repeat;
    filter: blur(80px) saturate(1.7);
    opacity: 0; transition: opacity 1s ease;
  }
  .ambient.on::after { opacity: var(--amb-opacity); }

  /* ---------- header ---------- */
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    max-width: 1240px; margin: 0 auto; padding: 18px clamp(16px, 4vw, 40px);
  }
  .brand {
    font: 600 30px/1 var(--serif); letter-spacing: -.02em; text-decoration: none;
    background: var(--foil); -webkit-background-clip: text; background-clip: text; color: transparent;
    padding-bottom: 4px;
  }
  .nav { display: flex; gap: 10px; }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px;
    border-radius: 999px; border: 1px solid var(--line-strong);
    background: color-mix(in srgb, var(--surface) 72%, transparent);
    font: 500 14px var(--sans); cursor: pointer;
  }
  .pill-btn:hover { background: var(--surface-hi); }
  .pill-btn svg { width: 18px; height: 18px; flex: none; }
  .pill-btn.icon-only { width: 42px; padding: 0; justify-content: center; }
  .badge {
    min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); font: 600 12px/22px var(--sans); text-align: center;
  }

  /* ---------- layout ---------- */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }
  .finder { text-align: center; padding-top: clamp(20px, 5vw, 64px); }
  body.has-results .finder { padding-top: 4px; }
  body.has-results .intro { display: none; }
  h1 {
    font: 500 clamp(36px, 6.4vw, 66px)/1.04 var(--serif); letter-spacing: -.025em;
    font-optical-sizing: auto; text-wrap: balance;
  }
  .sub { margin-top: 14px; color: var(--muted); font-size: clamp(16px, 2vw, 19px); text-wrap: balance; }

  /* ---------- search ---------- */
  .search { position: relative; max-width: 680px; margin: 28px auto 0; text-align: left; }
  .field {
    display: flex; align-items: center; gap: 12px; height: 62px; padding: 0 10px 0 22px;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; box-shadow: var(--shadow);
    transition: border-color .2s, box-shadow .2s;
  }
  .field:focus-within {
    border-color: var(--accent-text);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-text) 22%, transparent), var(--shadow);
  }
  .field > svg { width: 22px; height: 22px; color: var(--muted); flex: none; }
  .field input {
    flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text);
    font: 500 18px var(--sans);
  }
  .field input::placeholder { color: var(--muted); font-weight: 400; }
  .clear {
    width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; color: var(--muted);
    cursor: pointer; display: grid; place-items: center;
  }
  .clear:hover { background: var(--surface-hi); color: var(--text); }
  .clear svg { width: 18px; height: 18px; }
  .suggest {
    position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 40; padding: 8px;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 22px; box-shadow: var(--shadow);
    max-height: min(60vh, 460px); overflow: auto;
  }
  .opt { display: block; padding: 10px 14px; border-radius: 14px; cursor: pointer; }
  .opt[aria-selected="true"], .opt:hover { background: var(--surface-hi); }
  .opt .o-title { display: block; font: 600 16px/1.3 var(--sans); }
  .opt .o-sub { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
  .no-match { padding: 14px; color: var(--muted); font-size: 15px; }

  /* ---------- section headings ---------- */
  section { margin-top: clamp(36px, 6vw, 64px); }
  h2.section {
    font: 500 clamp(22px, 3vw, 30px)/1.2 var(--serif); letter-spacing: -.015em; text-wrap: balance;
  }
  .note { color: var(--muted); font-size: 15px; margin-top: 6px; text-wrap: pretty; }
  .ttl { display: inline-block; }

  /* ---------- covers ---------- */
  .cover {
    position: relative; aspect-ratio: 2 / 3; overflow: hidden; container-type: inline-size;
    border-radius: 5px 10px 10px 5px; background: var(--surface); box-shadow: var(--shadow);
  }
  .cover::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(90deg, rgba(0, 0, 0, .3) 0, rgba(255, 255, 255, .14) 2.5%, rgba(0, 0, 0, 0) 7%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08);
  }
  .cover img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s;
  }
  .cover img.ok { opacity: 1; }
  .art {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
    padding: 13cqw 11cqw; color: #f7efdd;
    background: linear-gradient(165deg, hsl(var(--h) 40% 30%), hsl(calc(var(--h) + 38) 46% 13%));
  }
  .art::before {
    content: ""; position: absolute; inset: 6cqw; border: 1px solid rgba(233, 196, 124, .6); border-radius: 3px;
  }
  .art b {
    position: relative; font: 600 12.5cqw/1.12 var(--serif); letter-spacing: -.01em;
    display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
  }
  .art i { position: relative; font: 500 8.5cqw/1.2 var(--sans); font-style: normal; opacity: .85; }

  /* ---------- grid and cards ---------- */
  .grid {
    list-style: none; margin: 26px 0 0; padding: 0; display: grid; gap: 30px 22px;
    grid-template-columns: repeat(auto-fill, minmax(var(--card, 166px), 1fr));
  }
  @media (max-width: 560px) { .grid { --card: 132px; gap: 24px 14px; } }
  .card {
    display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer;
  }
  .card .cover img { transition: opacity .4s, transform .5s cubic-bezier(.2, .8, .2, 1); }
  .card:hover .cover img.ok { transform: scale(1.03); }
  .card .meta { display: block; padding-top: 12px; }
  .card .ct {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    font: 600 16px/1.28 var(--serif); letter-spacing: -.005em;
  }
  .card .ca { display: block; margin-top: 3px; color: var(--muted); font-size: 14px; }
  .card .cs { display: block; margin-top: 6px; color: var(--moon); font-size: 13px; }
  .rise { animation: rise .55s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 32ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  .skel .cover { background: linear-gradient(100deg, var(--surface) 30%, var(--surface-hi) 50%, var(--surface) 70%); background-size: 250% 100%; animation: shimmer 1.4s linear infinite; }
  .skel .cover::after { display: none; }
  .skel .line { height: 12px; border-radius: 6px; background: var(--surface); margin-top: 12px; width: 80%; }
  .skel .line + .line { width: 50%; margin-top: 8px; }
  @keyframes shimmer { to { background-position: -150% 0; } }

  /* ---------- source book ---------- */
  .source {
    display: grid; gap: 18px clamp(20px, 4vw, 48px); align-items: start;
    grid-template-columns: minmax(140px, 220px) 1fr;
    grid-template-areas: "cover head" "cover desc";
    margin-top: 30px; padding: clamp(18px, 3vw, 34px);
    border: 1px solid var(--line); border-radius: 30px;
    background: color-mix(in srgb, var(--surface) 76%, transparent);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  }
  .s-cover { grid-area: cover; }
  .s-head { grid-area: head; align-self: end; }
  .s-desc { grid-area: desc; align-self: start; }
  .s-head h2 { font: 500 clamp(28px, 4.4vw, 46px)/1.08 var(--serif); letter-spacing: -.02em; text-wrap: balance; }
  .series { margin-top: 8px; color: var(--accent-text); font-weight: 500; font-size: 15px; }
  .by { margin-top: 6px; font-size: 18px; color: var(--muted); }
  .s-head .pills { margin-top: 16px; }
  @media (max-width: 680px) {
    .source { grid-template-columns: 112px 1fr; grid-template-areas: "cover head" "desc desc"; gap: 16px; border-radius: 24px; }
    .s-head { align-self: start; }
    .s-head h2 { font-size: 24px; }
    .by { font-size: 16px; }
    .s-head .pills { display: none; }
  }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .pill {
    display: inline-block; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line-strong);
    color: var(--muted); font: 500 13px/1.4 var(--sans); background: transparent;
  }
  .pill.shared { color: var(--moon); border-color: color-mix(in srgb, var(--moon) 55%, transparent); background: var(--moon-bg); }
  button.pill { cursor: pointer; }
  button.pill:hover { border-color: var(--moon); color: var(--text); }
  button.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .desc-body { font: 400 17px/1.7 var(--serif); max-width: 64ch; color: color-mix(in srgb, var(--text) 92%, transparent); }
  .desc-body p + p { margin-top: .85em; }
  .desc-body.clamp {
    max-height: calc(1.7em * 4); overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent);
  }
  .link {
    margin-top: 10px; padding: 6px 0; background: none; border: 0; cursor: pointer;
    color: var(--accent-text); font: 600 15px var(--sans); text-decoration: underline; text-underline-offset: 4px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 22px;
    border-radius: 999px; border: 1px solid transparent; cursor: pointer; text-decoration: none;
    background: var(--accent); color: var(--accent-ink); font: 600 15px var(--sans);
  }
  .btn:hover { filter: brightness(1.07); }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--line-strong); }
  .btn.ghost:hover { background: var(--surface-hi); filter: none; }
  .btn svg { width: 18px; height: 18px; }

  /* ---------- results toolbar ---------- */
  .toolbar { display: grid; gap: 16px; margin-top: clamp(34px, 5vw, 56px); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chips .label { color: var(--muted); font-size: 14px; margin-right: 4px; }
  .empty { margin-top: 28px; padding: 28px; border: 1px dashed var(--line-strong); border-radius: 20px; color: var(--muted); }
  .empty .link { display: inline; margin: 0; padding: 0; }
  .more { display: flex; justify-content: center; margin-top: 34px; }

  /* ---------- sheets (details and reading list) ---------- */
  dialog.sheet {
    border: 0; padding: 0; margin: 0 0 0 auto; width: min(620px, 100vw); max-width: 100vw;
    height: 100dvh; max-height: 100dvh; overflow: hidden; color: var(--text); background: var(--bg-soft);
    border-left: 1px solid var(--line); box-shadow: -34px 0 90px -24px rgba(0, 0, 0, .7);
  }
  dialog.sheet[open] { display: flex; flex-direction: column; animation: slide .34s cubic-bezier(.2, .8, .2, 1); }
  dialog.sheet::backdrop { background: rgba(9, 6, 18, .62); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  @keyframes slide { from { transform: translateX(28px); opacity: 0; } }
  @media (max-width: 700px) {
    dialog.sheet { width: 100vw; height: 92dvh; max-height: 92dvh; margin: auto 0 0; border-left: 0; border-top: 1px solid var(--line); border-radius: 26px 26px 0 0; }
    dialog.sheet[open] { animation-name: rise-sheet; }
    @keyframes rise-sheet { from { transform: translateY(40px); opacity: 0; } }
  }
  .x {
    position: absolute; top: 14px; right: 14px; z-index: 5; width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--line-strong); background: color-mix(in srgb, var(--bg-soft) 80%, transparent);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); cursor: pointer; display: grid; place-items: center;
  }
  .x:hover { background: var(--surface-hi); }
  .x svg { width: 20px; height: 20px; }
  .sheet-inner { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .sheet-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .sheet-top { position: relative; display: flex; gap: 22px; align-items: flex-end; padding: 34px 28px 22px; overflow: hidden; }
  .sheet-bg { position: absolute; inset: -20%; background: var(--amb-img, none) center / cover; filter: blur(50px) saturate(1.6); opacity: .42; }
  .sheet-top::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 40%, var(--bg-soft)); }
  .sheet-top > * { position: relative; z-index: 1; }
  .sheet-top::after { z-index: 0; }
  .sheet-cover { width: clamp(110px, 28vw, 168px); flex: none; }
  .sheet-head { min-width: 0; padding-right: 40px; }
  .sheet-head h2 { font: 500 clamp(24px, 4.5vw, 32px)/1.1 var(--serif); letter-spacing: -.015em; text-wrap: balance; }
  .sheet-main { padding: 6px 28px 36px; display: grid; gap: 22px; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 20px; color: var(--muted); font-size: 14px; }
  .legend { color: var(--muted); font-size: 14px; margin-top: -8px; }
  .sub-h { font: 600 15px var(--sans); color: var(--muted); margin-bottom: 10px; }
  .sheet-actions {
    display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 28px calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--bg-soft);
  }
  .link.plain { display: inline-flex; align-items: center; gap: 6px; margin: 0; }
  .link.plain svg { width: 16px; height: 16px; }
  @media (max-width: 700px) {
    .sheet-actions .find { flex: 1; }
    .sheet-actions .save { width: 46px; padding: 0; flex: none; }
    .sheet-actions .save .txt { display: none; }
  }
  .sheet-title { font: 500 28px/1.1 var(--serif); padding: 26px 28px 8px; letter-spacing: -.015em; }
  .list-items { list-style: none; margin: 0; padding: 8px 28px 28px; display: grid; gap: 14px; }
  .list-item { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
  .list-item .li-title { font: 600 17px/1.25 var(--serif); }
  .list-item .li-author { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .list-item .li-actions { display: flex; gap: 14px; margin-top: 8px; }
  .list-item .link { margin: 0; padding: 4px 0; font-size: 14px; }
  .list-empty { padding: 8px 28px; color: var(--muted); max-width: 44ch; }

  /* ---------- misc ---------- */
  /* A popover sits in the top layer, so the toast shows above open sheets too. */
  .toast {
    position: fixed; inset: auto; left: 50%; bottom: 26px; margin: 0; transform: translateX(-50%); pointer-events: none;
    padding: 12px 20px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
    font: 600 15px var(--sans); box-shadow: var(--shadow); overflow: visible;
  }
  .toast:popover-open { animation: toast-in .25s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 16px); } }
  footer { margin: 80px auto 40px; padding: 0 clamp(16px, 4vw, 40px); max-width: 1240px; color: var(--muted); font-size: 14px; }
  .error { max-width: 560px; margin: 36px auto 0; padding: 20px 24px; border: 1px solid var(--line-strong); border-radius: 18px; color: var(--text); background: var(--surface); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <header class="top">
    <a class="brand" href="/" id="brand" aria-label="Shelved, go to the start">Shelved</a>
    <nav class="nav" aria-label="Site">
      <button class="pill-btn" type="button" id="listBtn" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
        Reading list <span class="badge" id="listCount" hidden>0</span>
      </button>
      <button class="pill-btn icon-only" type="button" id="themeBtn" aria-label="Switch to light theme"></button>
    </nav>
  </header>

  <main class="wrap" id="main">
    <div class="finder">
      <div class="intro">
        <h1>Finished a book you loved?</h1>
        <p class="sub" id="sub">Search for it and see what to read next.</p>
      </div>
      <form class="search" id="searchForm" role="search" autocomplete="off">
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="text" role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list" aria-label="Search by book title or author" placeholder="Search a title or author" enterkeyhint="search" spellcheck="false">
          <button class="clear" type="button" id="clear" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="suggest" id="suggest" role="listbox" aria-label="Matching books" hidden></div>
      </form>
    </div>

    <section id="home" aria-labelledby="homeTitle">
      <h2 class="section" id="homeTitle">Or start from a favourite</h2>
      <ul class="grid" id="popular"></ul>
    </section>

    <section id="results" aria-live="polite" hidden>
      <article class="source" id="source"></article>
      <div class="toolbar">
        <div>
          <h2 class="section" id="resultsTitle"></h2>
          <p class="note">Closest genre match first. Ties go to the book more people have rated.</p>
        </div>
        <div class="chips" id="chips" role="group" aria-label="Narrow by genre"></div>
      </div>
      <ul class="grid" id="grid"></ul>
      <div class="more"><button class="btn ghost" type="button" id="moreBtn" hidden></button></div>
    </section>
  </main>

  <footer>Book covers from <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a>.</footer>

  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <button class="x" type="button" id="sheetClose" aria-label="Close details">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="sheetBody" class="sheet-inner"></div>
  </dialog>

  <dialog class="sheet" id="listSheet" aria-labelledby="listTitle">
    <button class="x" type="button" id="listClose" aria-label="Close reading list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="sheet-inner"><div class="sheet-scroll" id="listBody"></div></div>
  </dialog>

  <div class="toast" id="toast" popover="manual" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  /* ---------- tiny helpers ---------- */
  const $ = (sel, root = document) => root.querySelector(sel);
  const el = (tag, props = {}, ...kids) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      node.append(kid.nodeType ? kid : document.createTextNode(kid));
    }
    return node;
  };
  const compact = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 });
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const HUES = [350, 275, 222, 165, 28, 318, 198, 46];
  const hueFor = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return HUES[h % HUES.length]; };

  const ICON = {
    bookmark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4 10 14M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  };
  const icon = (name) => { const t = document.createElement('template'); t.innerHTML = ICON[name]; return t.content.firstChild; };

  /* ---------- storage (safe if blocked) ---------- */
  const store = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* ignore */ } },
  };

  /* ---------- state ---------- */
  const state = { data: null, filters: new Set(), shown: 12, token: 0 };
  const PAGE = 12;

  /* ---------- theme ---------- */
  const themeBtn = $('#themeBtn');
  const currentTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  function paintThemeButton() {
    const light = currentTheme() === 'light';
    themeBtn.replaceChildren(icon(light ? 'moon' : 'sun'));
    themeBtn.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
  }
  themeBtn.addEventListener('click', () => {
    const next = currentTheme() === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('Shelved.theme', next); } catch { /* ignore */ }
    paintThemeButton();
  });
  paintThemeButton();

  /* ---------- toast ---------- */
  let toastTimer;
  function toast(message) {
    const t = $('#toast');
    t.textContent = message;
    try { if (t.matches(':popover-open')) t.hidePopover(); t.showPopover(); } catch { /* older browsers: the button label still changes */ }
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { try { t.hidePopover(); } catch { /* ignore */ } }, 2200);
  }

  /* ---------- reading list ---------- */
  const LIST_KEY = 'Shelved.list.v1';
  const list = {
    items: store.get(LIST_KEY, []),
    has(id) { return this.items.some((b) => b.id === id); },
    toggle(b) {
      if (this.has(b.id)) { this.items = this.items.filter((x) => x.id !== b.id); store.set(LIST_KEY, this.items); paintCount(); return false; }
      this.items.push({ id: b.id, title: b.title, authors: b.authors, isbn: b.isbn });
      store.set(LIST_KEY, this.items); paintCount(); return true;
    },
  };
  function paintCount() {
    const badge = $('#listCount');
    badge.textContent = list.items.length;
    badge.hidden = list.items.length === 0;
  }
  paintCount();

  /* ---------- covers ---------- */
  function coverEl(b, size = 'M', cls = '') {
    const wrap = el('div', { class: `cover ${cls}`.trim(), style: `--h:${hueFor(b.title)}` },
      el('div', { class: 'art', 'aria-hidden': 'true' }, el('b', { text: b.title }), el('i', { text: b.authors[0] || '' })));
    if (b.isbn) {
      // Open Library limits how fast covers can be fetched, so a miss can be temporary.
      // Try once more after a minute; the designed cover shows in the meantime.
      const load = (attempt) => {
        const img = new Image();
        img.alt = '';
        img.decoding = 'async';
        if (size !== 'L') img.loading = 'lazy';
        img.addEventListener('load', () => img.classList.add('ok'));
        img.addEventListener('error', () => {
          img.remove();
          if (attempt === 0) setTimeout(() => { if (wrap.isConnected) load(1); }, 60000);
        });
        img.src = `/cover/${b.isbn}?size=${size}${attempt ? '&r=' + attempt : ''}`;
        wrap.append(img);
      };
      load(0);
    }
    return wrap;
  }

  /* ---------- ambient glow from the chosen cover ---------- */
  function setAmbient(b) {
    const amb = $('#ambient');
    amb.classList.remove('on');
    if (!b || !b.isbn) return;
    const url = `/cover/${b.isbn}?size=L`;
    const probe = new Image();
    probe.onload = () => { amb.style.setProperty('--amb-img', `url("${url}")`); requestAnimationFrame(() => amb.classList.add('on')); };
    probe.src = url;
  }

  /* ---------- description with Read more ---------- */
  function descBlock(paragraphs, { clamp = false } = {}) {
    const text = paragraphs && paragraphs.length ? paragraphs : ['No description is available for this book.'];
    const body = el('div', { class: 'desc-body' + (clamp ? ' clamp' : '') }, text.map((p) => el('p', { text: p })));
    const wrap = el('div', { class: 'desc' }, body);
    if (clamp) {
      const toggle = el('button', {
        class: 'link', type: 'button', 'aria-expanded': 'false', text: 'Read more',
        onclick() {
          const open = body.classList.toggle('clamp') === false;
          toggle.setAttribute('aria-expanded', String(open));
          toggle.textContent = open ? 'Show less' : 'Read more';
        },
      });
      toggle.hidden = true;
      wrap.append(toggle);
      requestAnimationFrame(() => { toggle.hidden = !(body.scrollHeight > body.clientHeight + 2); });
    }
    return wrap;
  }

  const pillList = (genres, shared = [], limit = 99) =>
    el('ul', { class: 'pills' }, genres.slice(0, limit).map((g) => el('li', { class: 'pill' + (shared.includes(g) ? ' shared' : ''), text: g })));

  const goodreadsUrl = (b) => 'https://www.goodreads.com/search?q=' + encodeURIComponent(b.isbn || `${b.title} ${b.authors[0] || ''}`);

  /* ---------- save button shared by hero and sheet ---------- */
  function saveButton(b, ghost = true) {
    const btn = el('button', { class: 'btn save' + (ghost ? ' ghost' : ''), type: 'button', 'aria-pressed': String(list.has(b.id)) });
    const paint = () => {
      const saved = list.has(b.id);
      const label = saved ? 'Remove from reading list' : 'Add to reading list';
      btn.setAttribute('aria-pressed', String(saved));
      btn.setAttribute('aria-label', label);
      btn.replaceChildren(icon('bookmark'), el('span', { class: 'txt', text: label }));
    };
    btn.addEventListener('click', () => { const added = list.toggle(b); paint(); toast(added ? 'Added to your reading list' : 'Removed from your reading list'); });
    paint();
    return btn;
  }

  /* ---------- details sheet ---------- */
  const sheet = $('#sheet');
  function buildSheet(b, ctx = {}) {
    const top = el('div', { class: 'sheet-top' });
    if (b.isbn) top.style.setProperty('--amb-img', `url("/cover/${b.isbn}?size=L")`);
    top.append(
      el('div', { class: 'sheet-bg', 'aria-hidden': 'true' }),
      coverEl(b, 'L', 'sheet-cover'),
      el('div', { class: 'sheet-head' },
        el('h2', { id: 'sheetTitle', text: b.title }),
        b.series ? el('p', { class: 'series', text: b.series }) : null,
        el('p', { class: 'by', text: 'by ' + b.authors.join(', ') })));

    const facts = [];
    if (b.pages) facts.push(`${b.pages} pages`);
    if (b.ratings) facts.push(`${compact.format(b.ratings)} ratings`);
    if (b.language) facts.push(b.language);
    if (b.publisher) facts.push(b.publisher);

    const shared = b.shared || [];
    const main = el('div', { class: 'sheet-main' },
      facts.length ? el('p', { class: 'facts' }, facts.map((f) => el('span', { text: f }))) : null,
      b.genres.length ? pillList(b.genres, shared) : null,
      shared.length && ctx.sourceTitle ? el('p', { class: 'legend', text: `Highlighted genres are shared with ${ctx.sourceTitle}.` }) : null,
      descBlock(b.description),
      b.characters && b.characters.length ? el('div', {}, el('h3', { class: 'sub-h', text: 'Characters' }), el('ul', { class: 'pills' }, b.characters.map((c) => el('li', { class: 'pill', text: c })))) : null,
      el('p', {}, el('a', { class: 'link plain', href: goodreadsUrl(b), target: '_blank', rel: 'noopener' }, 'Look up on Goodreads', icon('external'))));

    const actions = el('div', { class: 'sheet-actions' },
      el('button', { class: 'btn find', type: 'button', onclick: () => { sheet.close(); selectBook(b.id); } }, icon('search'), 'Find books like this'),
      saveButton(b));

    return [el('div', { class: 'sheet-scroll' }, top, main), actions];
  }
  function openSheet(b, ctx) {
    $('#sheetBody').replaceChildren(...buildSheet(b, ctx));
    if (!sheet.open) sheet.showModal();
    $('#sheetBody .sheet-scroll').scrollTop = 0;
  }
  $('#sheetClose').addEventListener('click', () => sheet.close());
  sheet.addEventListener('click', (e) => { if (e.target === sheet) sheet.close(); });

  /* ---------- reading list sheet ---------- */
  const listSheet = $('#listSheet');
  function renderList() {
    const body = $('#listBody');
    body.replaceChildren(el('h2', { class: 'sheet-title', id: 'listTitle', text: 'Reading list' }));
    if (!list.items.length) {
      body.append(el('p', { class: 'list-empty', text: 'Nothing saved yet. Open a book and choose Add to reading list.' }));
      return;
    }
    body.append(el('ul', { class: 'list-items' }, list.items.map((b) =>
      el('li', { class: 'list-item' },
        coverEl({ title: b.title, authors: b.authors, isbn: b.isbn }, 'M'),
        el('div', {},
          el('p', { class: 'li-title', text: b.title }),
          el('p', { class: 'li-author', text: b.authors.join(', ') }),
          el('div', { class: 'li-actions' },
            el('button', { class: 'link', type: 'button', text: 'Find similar', onclick: () => { listSheet.close(); selectBook(b.id); } }),
            el('button', { class: 'link', type: 'button', text: 'Remove', onclick: () => { list.toggle(b); renderList(); } })))))));
  }
  $('#listBtn').addEventListener('click', () => { renderList(); listSheet.showModal(); });
  $('#listClose').addEventListener('click', () => listSheet.close());
  listSheet.addEventListener('click', (e) => { if (e.target === listSheet) listSheet.close(); });

  /* ---------- cards and grids ---------- */
  function cardEl(b, { onOpen, showShared = false, index = -1 }) {
    const meta = el('span', { class: 'meta' },
      el('span', { class: 'ct', text: b.title }),
      el('span', { class: 'ca', text: b.authors.join(', ') }),
      showShared && b.n_shared ? el('span', { class: 'cs', text: plural(b.n_shared, 'shared genre', 'shared genres') }) : null);
    const btn = el('button', { class: 'card', type: 'button', 'aria-haspopup': 'dialog', onclick: () => onOpen(b) }, coverEl(b, 'M'), meta);
    const li = el('li', { class: index >= 0 ? 'rise' : '' }, btn);
    if (index >= 0) li.style.setProperty('--i', index);
    return li;
  }
  function skeletons(n = 12) {
    return Array.from({ length: n }, () => el('li', { class: 'skel', 'aria-hidden': 'true' }, el('div', { class: 'cover' }), el('div', { class: 'line' }), el('div', { class: 'line' })));
  }
  const failure = (msg) => el('div', { class: 'error', role: 'alert', text: msg });
  const SERVER_DOWN = 'Cannot reach the Shelved server. Check that uvicorn is still running in your terminal, then reload this page.';

  /* ---------- home: popular picks ---------- */
  async function loadPopular() {
    const grid = $('#popular');
    grid.replaceChildren(...skeletons(12));
    try {
      const res = await fetch('/api/popular?n=12');
      if (!res.ok) throw new Error(res.status);
      const { total, books } = await res.json();
      $('#sub').textContent = `Search any of ${total.toLocaleString('en-GB')} books and see what to read next.`;
      grid.replaceChildren(...books.map((b, i) => cardEl(b, { onOpen: (x) => selectBook(x.id), index: i })));
    } catch {
      grid.replaceChildren();
      grid.after(failure(SERVER_DOWN));
    }
  }

  /* ---------- results ---------- */
  function genreChips(similar) {
    const counts = new Map();
    similar.forEach((b) => b.genres.forEach((g) => counts.set(g, (counts.get(g) || 0) + 1)));
    const n = similar.length;
    let pool = [...counts].filter(([, c]) => c >= 3 && c <= n * 0.85);
    if (pool.length < 4) pool = [...counts].filter(([, c]) => c >= 2 && c < n);
    return pool.sort((a, b) => b[1] - a[1]).slice(0, 10).map(([g]) => g);
  }
  const visibleBooks = () => state.data.similar.filter((b) => [...state.filters].every((g) => b.genres.includes(g)));

  function renderSource(b) {
    const head = el('div', { class: 's-head' },
      el('h2', { text: b.title }),
      b.series ? el('p', { class: 'series', text: b.series }) : null,
      el('p', { class: 'by', text: 'by ' + b.authors.join(', ') }),
      b.genres.length ? pillList(b.genres, [], 6) : null);
    const desc = el('div', { class: 's-desc' }, descBlock(b.description, { clamp: true }), el('div', { class: 'actions' }, saveButton(b)));
    $('#source').replaceChildren(el('div', { class: 's-cover' }, coverEl(b, 'L')), head, desc);
  }
  function renderChips() {
    const wrap = $('#chips');
    const genres = state.data.chips;
    if (!genres.length) { wrap.replaceChildren(); return; }
    wrap.replaceChildren(el('span', { class: 'label', text: 'Narrow by genre' }),
      ...genres.map((g) => el('button', {
        class: 'pill', type: 'button', text: g, 'aria-pressed': String(state.filters.has(g)),
        onclick: () => { state.filters.has(g) ? state.filters.delete(g) : state.filters.add(g); state.shown = PAGE; renderChips(); renderGrid(false); },
      })));
    if (state.filters.size) wrap.append(el('button', { class: 'link', type: 'button', text: 'Clear', style: 'margin:0', onclick: () => { state.filters.clear(); state.shown = PAGE; renderChips(); renderGrid(false); } }));
  }
  function renderGrid(animate) {
    const grid = $('#grid'), more = $('#moreBtn');
    const all = visibleBooks();
    const slice = all.slice(0, state.shown);
    document.querySelector('#grid + .empty')?.remove();
    grid.replaceChildren(...slice.map((b, i) => cardEl(b, {
      showShared: true, index: animate && i < PAGE ? i : -1,
      onOpen: (x) => openSheet(x, { sourceTitle: state.data.book.title }),
    })));
    if (!slice.length) {
      grid.after(el('div', { class: 'empty' }, 'No book here has all of those genres. ',
        el('button', { class: 'link', type: 'button', text: 'Clear the genre filters', onclick: () => { state.filters.clear(); renderChips(); renderGrid(false); } })));
    }
    const left = all.length - slice.length;
    more.hidden = left <= 0;
    if (left > 0) more.textContent = `Show ${Math.min(left, PAGE)} more (${left} left)`;
  }
  $('#moreBtn').addEventListener('click', () => { state.shown += PAGE; renderGrid(false); });

  async function selectBook(id, { push = true } = {}) {
    closeSuggest();
    const token = ++state.token;
    document.body.classList.add('has-results');
    $('#home').hidden = true;
    $('#results').hidden = false;
    $('#source').replaceChildren();
    $('#chips').replaceChildren();
    $('#resultsTitle').textContent = 'Finding books…';
    $('#grid').replaceChildren(...skeletons(12));
    $('#moreBtn').hidden = true;
    document.querySelector('#grid + .empty, #results > .error')?.remove();
    try {
      const res = await fetch(`/api/book/${id}?n=36`);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      if (token !== state.token) return;
      data.chips = genreChips(data.similar);
      state.data = data; state.filters.clear(); state.shown = PAGE;
      $('#q').value = data.book.title; $('#clear').hidden = false;
      $('#resultsTitle').replaceChildren('Because you read ', el('span', { class: 'ttl', text: data.book.title }));
      document.title = `Books like ${data.book.title} - Shelved`;
      renderSource(data.book); renderChips(); renderGrid(true); setAmbient(data.book);
      if (push) history.pushState({ id }, '', `?b=${id}`);
      window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
    } catch {
      if (token !== state.token) return;
      $('#grid').replaceChildren();
      $('#resultsTitle').textContent = 'Something went wrong';
      $('#grid').after(failure(SERVER_DOWN));
    }
  }
  function goHome({ push = true } = {}) {
    state.token++;
    document.body.classList.remove('has-results');
    $('#results').hidden = true; $('#home').hidden = false;
    document.querySelectorAll('#results > .error').forEach((n) => n.remove());
    $('#q').value = ''; $('#clear').hidden = true; closeSuggest(); setAmbient(null);
    document.title = 'Shelved';
    if (push) history.pushState({}, '', location.pathname);
    window.scrollTo({ top: 0 });
  }
  $('#brand').addEventListener('click', (e) => { e.preventDefault(); goHome(); });
  window.addEventListener('popstate', () => {
    const id = new URLSearchParams(location.search).get('b');
    if (id != null && id !== '') selectBook(Number(id), { push: false }); else goHome({ push: false });
  });

  /* ---------- search box with suggestions ---------- */
  const input = $('#q'), box = $('#suggest'), clearBtn = $('#clear');
  const sug = { items: [], active: -1, timer: 0, ctrl: null };

  function closeSuggest() {
    box.hidden = true; sug.items = []; sug.active = -1;
    input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant');
  }
  function setActive(i) {
    sug.active = i;
    box.querySelectorAll('.opt').forEach((o, n) => o.setAttribute('aria-selected', String(n === i)));
    if (i >= 0) { input.setAttribute('aria-activedescendant', `opt-${i}`); box.querySelector(`#opt-${i}`)?.scrollIntoView({ block: 'nearest' }); }
    else input.removeAttribute('aria-activedescendant');
  }
  function renderSuggest(items, q) {
    sug.items = items; sug.active = -1;
    box.hidden = false; input.setAttribute('aria-expanded', 'true');
    if (!items.length) { box.replaceChildren(el('div', { class: 'no-match', text: `No book matches "${q}". Try fewer words or the author's name.` })); return; }
    box.replaceChildren(...items.map((b, i) => el('div', {
      class: 'opt', id: `opt-${i}`, role: 'option', 'aria-selected': 'false',
      onmousedown: (e) => { e.preventDefault(); selectBook(b.id); },
      onmousemove: () => { if (sug.active !== i) setActive(i); },
    }, el('span', { class: 'o-title', text: b.title }), el('span', { class: 'o-sub', text: b.authors.join(', ') }), b.series ? el('span', { class: 'o-sub', text: b.series }) : null)));
  }
  async function fetchSuggest(q) {
    sug.ctrl?.abort(); sug.ctrl = new AbortController();
    try {
      const res = await fetch(`/api/suggest?q=${encodeURIComponent(q)}`, { signal: sug.ctrl.signal });
      if (!res.ok) throw new Error(res.status);
      renderSuggest(await res.json(), q);
    } catch (err) {
      if (err.name === 'AbortError') return;
      box.hidden = false; box.replaceChildren(el('div', { class: 'no-match', text: SERVER_DOWN }));
    }
  }
  input.addEventListener('input', () => {
    clearBtn.hidden = !input.value;
    clearTimeout(sug.timer);
    const q = input.value.trim();
    if (!q) { sug.ctrl?.abort(); closeSuggest(); return; }
    sug.timer = setTimeout(() => fetchSuggest(q), 130);
  });
  input.addEventListener('keydown', (e) => {
    const n = sug.items.length;
    if (e.key === 'ArrowDown' && n) { e.preventDefault(); setActive((sug.active + 1) % n); }
    else if (e.key === 'ArrowUp' && n) { e.preventDefault(); setActive((sug.active - 1 + n) % n); }
    else if (e.key === 'Escape') { closeSuggest(); }
  });
  input.addEventListener('focus', () => { if (input.value.trim() && !sug.items.length && !box.hidden) fetchSuggest(input.value.trim()); });
  $('#searchForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    clearTimeout(sug.timer);
    if (sug.items.length) { selectBook(sug.items[Math.max(sug.active, 0)].id); return; }
    await fetchSuggest(q);
    if (sug.items.length) selectBook(sug.items[0].id);
  });
  clearBtn.addEventListener('click', () => { input.value = ''; clearBtn.hidden = true; closeSuggest(); input.focus(); });
  document.addEventListener('click', (e) => { if (!e.target.closest('.search')) closeSuggest(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && !document.querySelector('dialog[open]')) {
      e.preventDefault(); input.focus(); input.select();
    }
  });

  /* ---------- start ---------- */
  const startId = new URLSearchParams(location.search).get('b');
  loadPopular();
  if (startId != null && startId !== '') selectBook(Number(startId), { push: false });
})();
</script>
</body>
</html>
